worker_processes auto;

http {
    keepalive_timeout 65;
    keepalive_requests 1000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    include mime.types;
     # Set the maximum allowed size of the client request body to 100MB
    client_max_body_size 2048M; 

    server {
        listen 80;
        # server_name ${SERVER_NAME};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
    listen 443 ssl;
  
    ssl_certificate /etc/nginx/ssl_cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl_cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Add all domains that should serve this stack
    server_name mrstudy.net www.mrstudy.net mrstudey.net www.mrstudey.net;
    root /var/www/html/public;

    index index.php index.html index.htm;

    location /admin_portal/ {
        root /home;
        try_files $uri $uri/ /admin_portal/index.html;
    }
    location /std_zoom/ {
        root /home;
        try_files $uri $uri/ /std_zoom/index.html;
    }
    
    # WebSocket proxy
    location /ws {
        proxy_pass http://app_ws:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Send query parameters to the WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }






    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Disable response buffering for PHP-FPM
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_keep_conn on;

        # Allow byte-range support
        add_header Accept-Ranges bytes;

        # Add headers for CORS and caching control (optional)
        add_header Cache-Control no-cache;
        # add_header Access-Control-Allow-Origin *;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
}

events{

    worker_connections 4096;
    multi_accept on;
}
